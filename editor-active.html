<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>通话界面编辑器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
    display: flex; align-items: center; gap: 10px; padding: 0 16px; z-index: 99;
  }
  #toolbar button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid #333;
    background: #222; color: #fff; cursor: pointer; font-size: 14px;
  }
  #toolbar #export { background: #2ecc5a; color: #000; font-weight: 600; }
  #toolbar #preview.on { background: #f1c40f; color: #000; }
  #toolbar .tip { margin-left: 12px; color: #888; font-size: 12px; }

  #stage { display: flex; justify-content: center; padding: 70px 0 30px; }
  .canvas {
    position: relative; width: 420px; height: 720px;
    background: #000; border: 1px solid #333; overflow: hidden;
  }
  .el {
    position: absolute; cursor: move; user-select: none;
    display: flex; align-items: center; justify-content: center;
    white-space: pre-wrap; word-break: break-word; text-align: center;
  }
  .el:hover { outline: 1px dashed rgba(255,255,255,0.35); }
  .el.selected { outline: 2px solid #2ecc5a; }
  .el .del {
    position: absolute; top: -12px; right: -12px; width: 26px; height: 26px;
    border-radius: 50%; border: none; background: #e03e3e; color: #fff;
    font-size: 15px; line-height: 26px; text-align: center; cursor: pointer;
    display: none; z-index: 3;
  }
  .el:hover .del, .el.selected .del { display: block; }
  .el .rs {
    position: absolute; right: -11px; bottom: -11px; width: 26px; height: 26px;
    background: #2ecc5a; border: 2px solid #fff; border-radius: 50%; cursor: nwse-resize; display: none; z-index: 3;
  }
  .el:hover .rs, .el.selected .rs { display: block; }
  body.preview .del, body.preview .rs { display: none !important; }
  body.preview .el { cursor: default; }
  body.preview .el:hover, body.preview .el.selected { outline: none; }

  #out {
    display: block; width: 420px; height: 200px; margin: 20px auto;
    background: #0a0a0a; color: #8f8; border: 1px solid #2a2a2a; font-size: 11px;
    padding: 10px; font-family: Consolas, monospace;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button id="font-plus">字号 +</button>
    <button id="font-minus">字号 -</button>
    <button id="preview">预览</button>
    <button id="export">导出</button>
    <span class="tip">点元素选中 → 拖拽移动 / 右下绿点缩放 / 滚轮或「字号+-」调字大小 / 双击改字 / 红✕删除</span>
  </div>

  <div id="stage">
    <div class="canvas" id="canvas">
      <div class="el" data-id="name" style="left:60px;top:54px;width:308px;height:155px;font-size:30px;color:#fff;font-weight:600"><span class="t">Mr.江</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="state" style="left:173px;top:193px;width:80px;font-size:14px;color:#7dff9a"><span class="t">通话中</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="timer" style="left:183px;top:222px;width:60px;font-size:15px;color:rgba(255,255,255,0.6)"><span class="t">00:00</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="hangup" style="left:81px;top:601px;width:74px;height:74px;border-radius:50%;background:#e03e3e;font-size:16px;color:#fff"><span class="t">挂断</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="answer" style="left:277px;top:602px;width:74px;height:74px;border-radius:50%;background:#2ecc5a;font-size:16px;color:#fff"><span class="t">接听</span><button class="del">✕</button><div class="rs"></div></div>
    </div>
  </div>

  <textarea id="out" readonly placeholder="导出后 JSON 显示在这里"></textarea>

  <script>
    let editing = null, mode = null, selected = null;
    let sx = 0, sy = 0, ox = 0, oy = 0, ow = 0, oh = 0;

    function select(el) {
      if (selected) selected.classList.remove('selected');
      selected = el;
      el.classList.add('selected');
    }

    document.querySelectorAll('.el').forEach((el) => {
      el.addEventListener('mousedown', (e) => {
        if (document.body.classList.contains('preview')) return;
        if (e.target.classList.contains('del') || e.target.classList.contains('rs')) return;
        select(el);
        mode = 'move'; editing = el;
        sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop;
        e.preventDefault();
      });
      el.querySelector('.rs').addEventListener('mousedown', (e) => {
        select(el);
        mode = 'resize'; editing = el;
        sx = e.clientX; sy = e.clientY; ow = el.offsetWidth; oh = el.offsetHeight;
        e.preventDefault(); e.stopPropagation();
      });
      el.querySelector('.del').addEventListener('click', (e) => {
        el.remove(); if (selected === el) selected = null;
        e.stopPropagation();
      });
      el.addEventListener('dblclick', (e) => {
        if (document.body.classList.contains('preview')) return;
        if (e.target.classList.contains('del') || e.target.classList.contains('rs')) return;
        const t = el.querySelector('.t');
        const nv = prompt('改成什么文字？', t.textContent);
        if (nv !== null) t.textContent = nv;
      });
      // 滚轮调字号
      el.addEventListener('wheel', (e) => {
        if (document.body.classList.contains('preview')) return;
        select(el);
        const cur = parseInt(getComputedStyle(el).fontSize, 10) || 16;
        el.style.fontSize = Math.max(8, cur + (e.deltaY < 0 ? 2 : -2)) + 'px';
        e.preventDefault();
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (!editing) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (mode === 'move') {
        editing.style.left = (ox + dx) + 'px';
        editing.style.top = (oy + dy) + 'px';
      } else if (mode === 'resize') {
        editing.style.width = Math.max(20, ow + dx) + 'px';
        editing.style.height = Math.max(20, oh + dy) + 'px';
      }
    });
    document.addEventListener('mouseup', () => { editing = null; mode = null; });

    function adjFont(delta) {
      if (!selected) { alert('先点一下要改的元素'); return; }
      const cur = parseInt(getComputedStyle(selected).fontSize, 10) || 16;
      selected.style.fontSize = Math.max(8, cur + delta) + 'px';
    }
    document.getElementById('font-plus').addEventListener('click', () => adjFont(2));
    document.getElementById('font-minus').addEventListener('click', () => adjFont(-2));

    document.getElementById('preview').addEventListener('click', () => {
      const on = document.body.classList.toggle('preview');
      document.getElementById('preview').classList.toggle('on', on);
    });

    document.getElementById('export').addEventListener('click', () => {
      const items = [];
      document.querySelectorAll('#canvas .el').forEach((el) => {
        const cs = getComputedStyle(el);
        items.push({
          id: el.dataset.id,
          text: el.querySelector('.t').textContent,
          x: el.offsetLeft, y: el.offsetTop,
          w: el.offsetWidth, h: el.offsetHeight,
          fontSize: parseInt(cs.fontSize, 10),
          color: cs.color,
          background: cs.backgroundColor,
          borderRadius: cs.borderRadius,
          fontWeight: cs.fontWeight
        });
      });
      const json = JSON.stringify({ active: items }, null, 2);
      document.getElementById('out').value = json;
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'design-active.json';
      a.click();
    });
  </script>
</body>
</html>
