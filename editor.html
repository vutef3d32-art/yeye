<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>来电界面编辑器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; color: #fff; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #toolbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: #1a1a1a; border-bottom: 1px solid #2a2a2a;
    display: flex; align-items: center; gap: 10px; padding: 0 16px; z-index: 99;
  }
  #toolbar button {
    padding: 8px 16px; border-radius: 8px; border: 1px solid #333;
    background: #222; color: #fff; cursor: pointer; font-size: 14px;
  }
  #toolbar .tab.active { background: #2ecc5a; color: #000; border-color: #2ecc5a; font-weight: 600; }
  #toolbar #export { background: #2ecc5a; color: #000; font-weight: 600; }
  #toolbar #preview.on { background: #f1c40f; color: #000; }

  #stage { display: flex; justify-content: center; padding: 70px 0 30px; }
  .canvas {
    position: relative; width: 420px; height: 720px;
    background: #000; border: 1px solid #333; overflow: hidden;
  }
  /* 每个可编辑元素 */
  .el {
    position: absolute; cursor: move; user-select: none;
    display: flex; align-items: center; justify-content: center;
    white-space: pre-wrap; word-break: break-word; text-align: center;
  }
  .el:hover { outline: 1px dashed rgba(255,255,255,0.35); }
  .el .del {
    position: absolute; top: -9px; right: -9px; width: 20px; height: 20px;
    border-radius: 50%; border: none; background: #e03e3e; color: #fff;
    font-size: 12px; line-height: 20px; text-align: center; cursor: pointer;
    display: none; z-index: 3;
  }
  .el:hover .del { display: block; }
  .el .rs {
    position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px;
    background: #2ecc5a; border-radius: 50%; cursor: nwse-resize; display: none; z-index: 3;
  }
  .el:hover .rs { display: block; }
  body.preview .del, body.preview .rs { display: none !important; }
  body.preview .el { cursor: default; }
  body.preview .el:hover { outline: none; }

  #out {
    display: block; width: 420px; height: 200px; margin: 20px auto;
    background: #0a0a0a; color: #8f8; border: 1px solid #2a2a2a; font-size: 11px;
    padding: 10px; font-family: Consolas, monospace;
  }
</style>
</head>
<body>
  <div id="toolbar">
    <button class="tab active" data-tab="incoming">来电界面</button>
    <button class="tab" data-tab="active">通话界面</button>
    <button id="preview">预览</button>
    <button id="export">导出</button>
    <span style="margin-left:12px;color:#888;font-size:12px">拖拽移动 · 右下角绿点缩放 · 双击改字 · 悬停红✕删除</span>
  </div>

  <div id="stage">
    <!-- 来电界面 -->
    <div class="canvas" id="canvas-incoming">
      <div class="el" data-id="label" style="left:180px;top:60px;width:60px;font-size:13px;color:rgba(255,255,255,0.5)"><span class="t">来电</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="avatar" style="left:162px;top:90px;width:96px;height:96px;border-radius:50%;background:#1c1c1e;border:1px solid #333;font-size:42px;color:#fff"><span class="t">江</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="name" style="left:140px;top:215px;width:140px;font-size:34px;color:#fff;font-weight:600"><span class="t">Mr.江</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="number" style="left:130px;top:265px;width:160px;font-size:18px;color:rgba(255,255,255,0.7);letter-spacing:2px"><span class="t">你的号码</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="address" style="left:185px;top:300px;width:50px;font-size:14px;color:rgba(255,255,255,0.5)"><span class="t">美国</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="status" style="left:150px;top:345px;width:120px;font-size:15px;color:#7dff9a"><span class="t">正在响铃…</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="hangup" style="left:120px;top:570px;width:74px;height:74px;border-radius:50%;background:#e03e3e;font-size:16px;color:#fff"><span class="t">挂断</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="answer" style="left:236px;top:570px;width:74px;height:74px;border-radius:50%;background:#2ecc5a;font-size:16px;color:#fff"><span class="t">接听</span><button class="del">✕</button><div class="rs"></div></div>
    </div>

    <!-- 通话界面 -->
    <div class="canvas" id="canvas-active" style="display:none">
      <div class="el" data-id="name" style="left:140px;top:70px;width:140px;font-size:30px;color:#fff;font-weight:600"><span class="t">Mr.江</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="state" style="left:170px;top:110px;width:80px;font-size:14px;color:#7dff9a"><span class="t">通话中</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="timer" style="left:180px;top:132px;width:60px;font-size:15px;color:rgba(255,255,255,0.6)"><span class="t">00:00</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="avatar" style="left:152px;top:175px;width:116px;height:116px;border-radius:50%;background:#1c1c1e;border:1px solid #333;font-size:50px;color:#fff"><span class="t">江</span><button class="del">✕</button><div class="rs"></div></div>
      <div class="el" data-id="hangup" style="left:173px;top:630px;width:74px;height:74px;border-radius:50%;background:#e03e3e;font-size:32px;color:#fff"><span class="t">✕</span><button class="del">✕</button><div class="rs"></div></div>
    </div>
  </div>

  <textarea id="out" readonly placeholder="导出后 JSON 显示在这里"></textarea>

  <script>
    // —— 编辑能力：拖拽 / 缩放 / 删除 / 双击改字 ——
    let editing = null; // 当前拖拽/缩放的元素
    let mode = null;    // 'move' | 'resize'
    let sx = 0, sy = 0, ox = 0, oy = 0, ow = 0, oh = 0;

    document.querySelectorAll('.el').forEach((el) => {
      // 拖拽移动（排除删除按钮和缩放手柄）
      el.addEventListener('mousedown', (e) => {
        if (document.body.classList.contains('preview')) return;
        if (e.target.classList.contains('del') || e.target.classList.contains('rs')) return;
        mode = 'move';
        editing = el;
        sx = e.clientX; sy = e.clientY;
        ox = el.offsetLeft; oy = el.offsetTop;
        e.preventDefault();
      });
      // 缩放
      el.querySelector('.rs').addEventListener('mousedown', (e) => {
        mode = 'resize';
        editing = el;
        sx = e.clientX; sy = e.clientY;
        ow = el.offsetWidth; oh = el.offsetHeight;
        e.preventDefault();
        e.stopPropagation();
      });
      // 删除
      el.querySelector('.del').addEventListener('click', (e) => {
        el.remove();
        e.stopPropagation();
      });
      // 双击改字
      el.addEventListener('dblclick', (e) => {
        if (document.body.classList.contains('preview')) return;
        if (e.target.classList.contains('del') || e.target.classList.contains('rs')) return;
        const t = el.querySelector('.t');
        const nv = prompt('改成什么文字？', t.textContent);
        if (nv !== null) t.textContent = nv;
      });
    });

    document.addEventListener('mousemove', (e) => {
      if (!editing) return;
      const dx = e.clientX - sx, dy = e.clientY - sy;
      if (mode === 'move') {
        editing.style.left = (ox + dx) + 'px';
        editing.style.top = (oy + dy) + 'px';
      } else if (mode === 'resize') {
        editing.style.width = Math.max(20, ow + dx) + 'px';
        editing.style.height = Math.max(20, oh + dy) + 'px';
      }
    });
    document.addEventListener('mouseup', () => { editing = null; mode = null; });

    // —— 界面 Tab 切换 ——
    document.querySelectorAll('.tab').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
        b.classList.add('active');
        const tab = b.dataset.tab;
        document.getElementById('canvas-incoming').style.display = tab === 'incoming' ? 'block' : 'none';
        document.getElementById('canvas-active').style.display = tab === 'active' ? 'block' : 'none';
      });
    });

    // —— 预览模式 ——
    document.getElementById('preview').addEventListener('click', () => {
      const on = document.body.classList.toggle('preview');
      document.getElementById('preview').classList.toggle('on', on);
    });

    // —— 导出：收集两个界面所有元素的位置/大小/文字/样式 ——
    document.getElementById('export').addEventListener('click', () => {
      const screens = {};
      ['incoming', 'active'].forEach((s) => {
        screens[s] = [];
        document.querySelectorAll('#canvas-' + s + ' .el').forEach((el) => {
          const cs = getComputedStyle(el);
          screens[s].push({
            id: el.dataset.id,
            text: el.querySelector('.t').textContent,
            x: el.offsetLeft, y: el.offsetTop,
            w: el.offsetWidth, h: el.offsetHeight,
            fontSize: parseInt(cs.fontSize, 10),
            color: cs.color,
            background: cs.backgroundColor,
            borderRadius: cs.borderRadius,
            fontWeight: cs.fontWeight
          });
        });
      });
      const json = JSON.stringify(screens, null, 2);
      document.getElementById('out').value = json;
      // 下载 design.json
      const blob = new Blob([json], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'design.json';
      a.click();
    });
  </script>
</body>
</html>
